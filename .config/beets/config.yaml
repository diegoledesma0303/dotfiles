directory: ~/Música
library: ~/musiclibrary.db

plugins: musicbrainz fetchart lastgenre fish
replace:
    '[\\/]': _
    '^\.': _
    '[\x00-\x1f]': _
    '[<>:"\?\*\|]': _
    '\.$': _
    '\s+$': ''
    '^\s+': ''
    '^-': _
original_date: yes
per_disc_numbering: no
import:
    from_scratch: yes
    timid: yes
    languages: en
paths:
    default: "$albumartist/($original_year) $album%aunique{}/$track. $title"
fetchart:
    sources:
        - filesystem

    
